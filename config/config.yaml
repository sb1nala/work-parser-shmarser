# Критерии отбора и параметры бота. Правится вручную.
# Ключевые слова при загрузке приводятся к нижнему регистру, ё -> е.

criteria:
  level_keywords: [стажер, стажёр, стажировка, intern, internship, trainee, junior, младший, начинающий]
  direction_keywords:
    - аналитик
    - analyst
    - analytics
    - аналитика
    - data scientist
    - data science
    - machine learning
    - ml
    - nlp
    - computer vision
    - cv
    - bi
    - product analyst
    - ds
  seniority_stopwords: [middle, senior, lead, ведущий, старший, главный, руководитель, head, principal]
  excluded_role_patterns:
    - 1с
    - 1c
    - бизнес-аналитик
    - бизнес аналитик
    - business analyst
    - системный аналитик
    - system analyst
    - аналитик продаж
    - маркетолог-аналитик
  max_experience_years: 0
  office_cities: [Москва, Тверь]
  allowed_employment: [full, part, internship, project]

# нормализованное имя компании -> каноническое
company_aliases:
  пао сбербанк: сбер
  сбербанк: сбер
  сбер: сбер
  тинькофф: т-банк
  т-банк: т-банк
  тбанк: т-банк
  ао тбанк: т-банк
  втб: втб
  банк втб: втб
  банк втб (пао): втб

schedule:
  every_hours: 4
source_timeout_seconds: 120
empty_alert_after_hours: 72
# Вакансия, пропавшая из источника меньше чем на столько часов и вернувшаяся,
# открывается молча (это сбой выдачи, а не новый набор). Дольше — «🔁 снова открыта».
reopen_after_hours: 168

sources:
  hh:
    # анонимный API hh.ru отдаёт 403; включать только с HH_ACCESS_TOKEN (приложение на dev.hh.ru)
    enabled: false
    per_page: 100
    max_pages: 20
    # hh отдаёт по запросу не больше 2000 вакансий; если found больше (или страниц больше
    # max_pages), источник падает с ошибкой, а не отдаёт обрезанный список — иначе
    # пропавшие из выдачи вакансии закрылись бы. Поэтому запросы сужены: офис/гибрид —
    # только Москва (area 1) и Тверская область (area 1783, id из GET /areas), плюс
    # удалёнка по всей стране (work_format REMOTE). Ошибка «narrow the query» в логе
    # значит, что запрос пора дробить дальше (например, Москву отдельно от области).
    # Ключи запроса уходят в API как есть; search_field по умолчанию name.
    queries:
      - text: &junior_text 'аналитик OR analyst OR "data scientist" OR "machine learning" OR ML OR "data science"'
        search_field: name
        experience: noExperience
        area: [1, 1783]
        order_by: publication_time
      - text: *junior_text
        search_field: name
        experience: noExperience
        work_format: REMOTE
        order_by: publication_time
      - text: &intern_text '(стажер OR стажёр OR intern OR trainee OR стажировка) AND (аналитик OR analyst OR data OR ML)'
        search_field: name
        area: [1, 1783]
        order_by: publication_time
      - text: *intern_text
        search_field: name
        work_format: REMOTE
        order_by: publication_time
  tbank:
    enabled: true
    categories: [tcareer_it, tcareer_back_office]
    include_internships: true
    limit: 100
    max_pages: 20
  sber:
    enabled: true
    # id профессиональных областей (GET /api/v1/profAreas): DS и DE, дата-сайентист,
    # BI-аналитик/аналитик данных, IT-аналитик, продуктовый аналитик, программист.
    # take: сервер отдаёт максимум 100; ~350 вакансий по этим областям.
    prof_areas:
      - 948a8e95-75fa-4184-9f10-a1fed94864f6
      - 563b89ac-8453-43d0-a7ef-af91f6481ced
      - d5e8b5e8-867c-4f98-b043-4732199cc58a
      - 9b07fbb7-3259-4eb5-839c-ea14b08ad51a
      - cb16d557-d39b-4e85-892d-172b7f1d9fe7
      - 39d29fd5-1a53-43ae-ab6f-1eda9ce5db58
    take: 100
    max_pages: 10
  vtb:
    enabled: true
    # лента hh.ru работодателя «Банк ВТБ» с rabota-vtb.ru (страница — 20 вакансий, per_page
    # сервер игнорирует). Без фильтров ~1100 вакансий (56 страниц), в основном розница и
    # колл-центры, поэтому запросы сужены по названию (язык запросов hh: OR, "фразы").
    # Работают только text и experience; ё/е равнозначны.
    queries:
      - text: 'стажер OR стажёр OR стажировка OR intern OR trainee OR юниор'
      - text: 'аналитик OR аналитика OR analyst OR analytics OR data OR ML OR "machine learning"'
    max_pages: 10
  alfa:
    enabled: true
    # job.alfabank.ru/api/vacancies, ~2150 вакансий целиком (в основном доставка и продажи),
    # поэтому запрос сужен направлениями (GET .../api/vacancies/options?listId=business_lines):
    # 1022 «Аналитика», 1018 «Data» (~70 вакансий). Стажировки Альфы на сайте с JS-защитой
    # (alfabank.ru/alfafuture) и намеренно не парсятся; здесь ловятся junior-роли без опыта.
    business_lines: ['1022', '1018']
    take: 100
    max_pages: 10
